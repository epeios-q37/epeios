<datalist id="Devices">
  {}
</datalist>
<fieldset>
  <legend>Showoff</legend>
  <fieldset style="display: flex; flex-direction: column; row-gap: 15px;">
    <legend>Partner</legend>
    <fieldset>
      <legend>Device</legend>
      <div style="display: flex; justify-content: space-between;">
        <input id="PartnerDevice" list="Devices" value="{}" class="clearable" placeholder="Device">
        <button xdh:onevent="PartnerConnect">Connect</button>
      </div>
    </fieldset>
    <span
      style="display: grid; grid-template-columns: auto auto auto; justify-content: space-around; grid-row-gap: 8px;">
      <button xdh:onevent="PartnerBuzzer">Buzzer</button>
      <button xdh:onevent="PartnerRing">Ring</button>
      <button xdh:onevent="PartnerLCD">LCD</button>
      <button xdh:onevent="PartnerOLEDGeo">OLED G</button>
      <button xdh:onevent="PartnerOLEDMov">OLED M</button>
      <button xdh:onevent="PartnerServos">Servos</button>
      <button xdh:onevent="PartnerIndy">Indy</button>
      <button xdh:onevent="PartnerMatrix">Matrix</button>
      <button xdh:onevent="PartnerListen">Listen</button>
      <span style="align-self: center;">
        <label>
          <span>Orient.:</span>
          <input type="checkbox" id="PartnerOrientation">
        </label>
      </span>
      <span></span>
      <label style="align-self: center;">
        <span>Whole:</span>
        <input type="checkbox" id="PartnerFormat">
      </label>
      <input id="PartnerColors" type="hidden">
    </span>
    <fieldset style="display: flex; justify-content: space-around;">
      <legend>Orientation</legend>

        <span>
          <span>Z: </span>
          <output style="display: inline-block; font-family: monospace; width: 4ch; font-size: larger;"
            id="PartnerOrientationZ"></output>
        </span>
        <span>
          <span>X: </span>
          <output style="display: inline-block; font-family: monospace; width: 4ch; font-size: larger;"
            id="PartnerOrientationX"></output>
        </span>
        <span>
          <span>Y: </span>
          <output style="display: inline-block; font-family: monospace; width: 4ch; font-size: larger;"
            id="PartnerOrientationY"></output>
        </span>
    </fieldset>
  </fieldset>
  <fieldset>
    <legend>Show</legend>
    <fieldset style="display: flex; justify-content: space-around; gap: 5px;">
      <legend>Devices</legend>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <input id="ShowLeftDevice" list="Devices" value="{}" class="clearable" placeholder="Left device">
        <input id="ShowMiddleDevice" list="Devices" value="{}" class="clearable" placeholder="Middle device">
        <input id="ShowRightDevice" list="Devices" value="{}" class="clearable" placeholder="Right device">
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <button xdh:onevent="ShowConnect">Connect</button>
        <button xdh:onevent="ShowSync">Sync</button>
        <button xdh:onevent="ShowTest">Test</button>
      </div>
    </fieldset>
    <div style="display: flex; flex-direction: column; width: 100%;">
      <span style="display:flex; width: 100%; justify-content: space-around; margin-top: 8px;">
        <button xdh:onevent="ShowIndy">Indy</button>
        <button xdh:onevent="ShowPink">Pink</button>
        <button xdh:onevent="ShowColors">Colors</button>
      </span>
      <span style="display:flex; width: 100%; justify-content: space-around;margin-top: 8px;">
        <select id="ShowTrios">
        </select>
        <button xdh:onevent="ShowPlay">Play</button>
        <label>
          <span>Countdown:</span>
          <input id="ShowCountdown" type="checkbox" checked_>
        </label>
      </span>
    </div>
  </fieldset>
</fieldset>
